<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="View a Hear Me Outs profile and post history." />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="images/design/css/all.min.css" />
    <script src="index.js" defer></script>
    <title>Profile - Hear Me Outs</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="images/design/hmo-transparent.png"
    />
  </head>
  <body>
    <div class="header">
      <a href="index.html">
        <div class="logo">
          <img
            src="images/design/hmo-transparent.png"
            alt="Hear Me Outs Logo"
          />
          <h1>Hear Me Outs</h1>
        </div>
      </a>
      <div class="nav">
        <a href="form.html">Submit HMO</a>
      </div>
    </div>
    <main class="profile-container">
      <section id="profile-details" aria-live="polite">
        <p>Loading profile...</p>

      <section id="profile-posts">
        <h2>Post History</h2>
        <p>Loading posts...</p>
      </section>
    </main>
