<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="images/design/css/all.min.css" />
    <script src="index.js" defer></script>
    <title>Submit - Hear Me Outs</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="images/design/hmo-transparent.png"
    />
  </head>
  <body>
    <div class="header">
      <a href="index.html"
        ><div class="logo">
          <img
            src="images/design/hmo-transparent.png"
            alt="Hear Me Outs Logo"
          />
          <h1>Hear Me Outs</h1>
        </div></a
      >

      <div class="nav">
        <a href="form.html">Submit HMO</a>
        <a href="signup.html">Sign Up</a>
      </div>
    </div>
    <main class="form-container">
      <form id="forumForm" novalidate>
        <h3>Submit your HMO</h3>
        <p class="status-msg" id="statusMsg" aria-live="polite" hidden>
          HMO submitted successfully!
        </p>

        <input
          type="text"
          id="authorName"
          name="authorName"
          placeholder="Your Username"
          required
        />
        <textarea
          id="postContent"
          name="postContent"
          rows="4"
          placeholder="Your HMO"
          required
        ></textarea>
        <label for="imageFile"><strong>Upload Image (Required):</strong></label>
        <input
          type="file"
          id="imageFile"
          name="imageFile"
          accept="image/*"
          required
        />
        <button type="submit" id="submit-btn">Submit for Review</button>
      </form>
    </main>
  </body>
</html>
