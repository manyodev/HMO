<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Submit your HMO (Hear Me Out)." />
    <meta
      name="google-site-verification"
      content="iAyP2labVlwA1udeagCVSFawy3AFd1TjURtyfgM6-mo"
    />
    <link rel="stylesheet" href="index.css" />
    <link rel="stylesheet" href="images/design/css/all.min.css" />
    <script src="index.js" defer></script>
    <title>Hear Me Outs</title>
    <link
      rel="icon"
      type="image/x-icon"
      href="images/design/hmo-transparent.png"
    />
  </head>
  <body>
    <div class="header">
      <a href="index.html"
        ><div class="logo">
          <img
            src="images/design/hmo-transparent.png"
            alt="Hear Me Outs Logo"
          />
          <h1>Hear Me Outs</h1>
        </div></a
      >

      <div class="nav">
        <a href="form.html">Submit HMO</a>
        <a href="signup.html">Sign Up</a>
      </div>
    </div>
    <main class="feed-page">
      <div class="feed-toolbar">
        <label for="feed-sort">Sort posts</label>
        <select id="feed-sort" name="sort">
          <option value="newest">Newest</option>
          <option value="most-liked">Most liked</option>
        </select>
        <label for="feed-topic">Topic</label>
        <select id="feed-topic" name="topic">
          <option value="all">All topics</option>
          <option value="Anime">Anime</option>
          <option value="Cartoon">Cartoon</option>
          <option value="Comics">Comics</option>
          <option value="K-pop">K-pop</option>
          <option value="Movies &amp; TV">Movies &amp; TV</option>
          <option value="Video game">Video game</option>
          <option value="Other">Other</option>
        </select>
      </div>
      <div id="approved-feed">Loading posts...</div>
    </main>
  </body>
</html>
